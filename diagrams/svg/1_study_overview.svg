<rect width="1180" height="640" fill="#FFFFFF"/>
<text x="20" y="34" font-size="18" font-weight="bold" fill="#222">The study at a glance</text>
<rect x="20" y="70" width="230" height="70" rx="7" fill="#DCEAF7" stroke="#3B6E9E" stroke-width="1.5"/>
<text x="135.0" y="93.3" font-size="13" text-anchor="middle" fill="#1A1A1A" font-weight="bold">Road network</text>
<text x="135.0" y="109.5" font-size="13" text-anchor="middle" fill="#1A1A1A">Michigan, OpenStreetMap</text>
<text x="135.0" y="125.8" font-size="13" text-anchor="middle" fill="#1A1A1A">56,923 road segments</text>
<rect x="20" y="160" width="230" height="70" rx="7" fill="#DCEAF7" stroke="#3B6E9E" stroke-width="1.5"/>
<text x="135.0" y="183.3" font-size="13" text-anchor="middle" fill="#1A1A1A" font-weight="bold">Charging stations</text>
<text x="135.0" y="199.6" font-size="13" text-anchor="middle" fill="#1A1A1A">AFDC export, Nov 2026</text>
<text x="135.0" y="215.8" font-size="13" text-anchor="middle" fill="#1A1A1A">994 charger entries</text>
<rect x="20" y="300" width="230" height="90" rx="7" fill="#DCEAF7" stroke="#3B6E9E" stroke-width="1.5"/>
<text x="135.0" y="333.3" font-size="13" text-anchor="middle" fill="#1A1A1A" font-weight="bold">Real trips (validation)</text>
<text x="135.0" y="349.6" font-size="13" text-anchor="middle" fill="#1A1A1A">DEVRT: Leaf e+, 2023</text>
<text x="135.0" y="365.8" font-size="13" text-anchor="middle" fill="#1A1A1A">VED: Michigan, incl. winter</text>
<rect x="310" y="110" width="250" height="120" rx="7" fill="#DFF0D8" stroke="#3C7A3C" stroke-width="1.5"/>
<text x="435.0" y="142.1" font-size="13" text-anchor="middle" fill="#1A1A1A" font-weight="bold">Referee</text>
<text x="435.0" y="158.3" font-size="13" text-anchor="middle" fill="#1A1A1A">SUMO drives every option,</text>
<text x="435.0" y="174.6" font-size="13" text-anchor="middle" fill="#1A1A1A">adds heating/cooling,</text>
<text x="435.0" y="190.8" font-size="13" text-anchor="middle" fill="#1A1A1A">charging time and price,</text>
<text x="435.0" y="207.1" font-size="13" text-anchor="middle" fill="#1A1A1A">checks every rule</text>
<rect x="310" y="300" width="250" height="90" rx="7" fill="#DFF0D8" stroke="#3C7A3C" stroke-width="1.5"/>
<text x="435.0" y="325.2" font-size="13" text-anchor="middle" fill="#1A1A1A" font-weight="bold">Validation</text>
<text x="435.0" y="341.4" font-size="13" text-anchor="middle" fill="#1A1A1A">DEVRT: +5.7% total energy</text>
<text x="435.0" y="357.7" font-size="13" text-anchor="middle" fill="#1A1A1A">VED held-out: 0.99 ratio</text>
<text x="435.0" y="373.9" font-size="13" text-anchor="middle" fill="#1A1A1A">(median trip error 15%)</text>
<rect x="620" y="70" width="250" height="100" rx="7" fill="#FCEFD4" stroke="#A8741A" stroke-width="1.5"/>
<text x="745.0" y="100.2" font-size="13" text-anchor="middle" fill="#1A1A1A" font-weight="bold">Test situations</text>
<text x="745.0" y="116.4" font-size="13" text-anchor="middle" fill="#1A1A1A">1,400 generated, 300 kept</text>
<text x="745.0" y="132.7" font-size="13" text-anchor="middle" fill="#1A1A1A">after testability checks</text>
<text x="745.0" y="148.9" font-size="13" text-anchor="middle" fill="#1A1A1A">(Ann Arbor; Detroit = training)</text>
<rect x="620" y="200" width="250" height="70" rx="7" fill="#FCEFD4" stroke="#A8741A" stroke-width="1.5"/>
<text x="745.0" y="231.4" font-size="13" text-anchor="middle" fill="#1A1A1A" font-weight="bold">What the model reads</text>
<text x="745.0" y="247.7" font-size="13" text-anchor="middle" fill="#1A1A1A">fact sheet + the driver&#x27;s sentence</text>
<rect x="930" y="180" width="230" height="110" rx="7" fill="#EADCF5" stroke="#6E4A9E" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="1045.0" y="215.2" font-size="13" text-anchor="middle" fill="#1A1A1A" font-weight="bold">Small language models</text>
<text x="1045.0" y="231.4" font-size="13" text-anchor="middle" fill="#1A1A1A">Qwen2.5 0.5B / 1.5B / 3B</text>
<text x="1045.0" y="247.7" font-size="13" text-anchor="middle" fill="#1A1A1A">4-bit, on the laptop CPU</text>
<text x="1045.0" y="263.9" font-size="13" text-anchor="middle" fill="#1A1A1A">roles R1, R2, R3</text>
<rect x="620" y="300" width="250" height="80" rx="7" fill="#EEEEEE" stroke="#666666" stroke-width="1.5"/>
<text x="745.0" y="328.3" font-size="13" text-anchor="middle" fill="#1A1A1A" font-weight="bold">Baselines</text>
<text x="745.0" y="344.6" font-size="13" text-anchor="middle" fill="#1A1A1A">goal-aware rule, nearest</text>
<text x="745.0" y="360.8" font-size="13" text-anchor="middle" fill="#1A1A1A">to 80%, random safe</text>
<rect x="930" y="330" width="230" height="140" rx="7" fill="#FBE0DC" stroke="#A8483A" stroke-width="1.5"/>
<text x="1045.0" y="363.9" font-size="13" text-anchor="middle" fill="#1A1A1A" font-weight="bold">Scoring vs. the referee</text>
<text x="1045.0" y="380.2" font-size="13" text-anchor="middle" fill="#1A1A1A">charge? (F1)</text>
<text x="1045.0" y="396.4" font-size="13" text-anchor="middle" fill="#1A1A1A">right charger (top-1)</text>
<text x="1045.0" y="412.7" font-size="13" text-anchor="middle" fill="#1A1A1A">target error, rules kept</text>
<text x="1045.0" y="428.9" font-size="13" text-anchor="middle" fill="#1A1A1A">optimality gap</text>
<text x="1045.0" y="445.2" font-size="13" text-anchor="middle" fill="#1A1A1A">time and memory</text>
<rect x="930" y="60" width="230" height="90" rx="7" fill="#EADCF5" stroke="#6E4A9E" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="1045.0" y="93.3" font-size="13" text-anchor="middle" fill="#1A1A1A" font-weight="bold">Adaptation</text>
<text x="1045.0" y="109.5" font-size="13" text-anchor="middle" fill="#1A1A1A">prompting and LoRA on the</text>
<text x="1045.0" y="125.8" font-size="13" text-anchor="middle" fill="#1A1A1A">Detroit training situations</text>
<rect x="620" y="490" width="250" height="70" rx="7" fill="#EADCF5" stroke="#6E4A9E" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="745.0" y="521.4" font-size="13" text-anchor="middle" fill="#1A1A1A" font-weight="bold">Deployment check</text>
<text x="745.0" y="537.7" font-size="13" text-anchor="middle" fill="#1A1A1A">latency and memory on a phone</text>
