<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#444"/></marker></defs>
<rect width="1180" height="560" fill="#FFFFFF"/>
<text x="20" y="34" font-size="18" font-weight="bold" fill="#222">How the referee finds the best answer for one situation</text>
<rect x="20" y="70" width="260" height="150" rx="7" fill="#FCEFD4" stroke="#A8741A" stroke-width="1.5"/>
<text x="150.0" y="108.9" font-size="13" text-anchor="middle" fill="#1A1A1A" font-weight="bold">One situation</text>
<text x="150.0" y="125.2" font-size="13" text-anchor="middle" fill="#1A1A1A">start, destination, time</text>
<text x="150.0" y="141.4" font-size="13" text-anchor="middle" fill="#1A1A1A">battery %, outside temperature</text>
<text x="150.0" y="157.7" font-size="13" text-anchor="middle" fill="#1A1A1A">driver&#x27;s goal (fastest/cheapest)</text>
<text x="150.0" y="173.9" font-size="13" text-anchor="middle" fill="#1A1A1A">optional deadline, budget</text>
<text x="150.0" y="190.2" font-size="13" text-anchor="middle" fill="#1A1A1A">3 to 9 chargers near the route</text>
<rect x="330" y="70" width="250" height="100" rx="7" fill="#DFF0D8" stroke="#3C7A3C" stroke-width="1.5"/>
<text x="455.0" y="100.2" font-size="13" text-anchor="middle" fill="#1A1A1A" font-weight="bold">1. List every option</text>
<text x="455.0" y="116.4" font-size="13" text-anchor="middle" fill="#1A1A1A">do not charge, or</text>
<text x="455.0" y="132.7" font-size="13" text-anchor="middle" fill="#1A1A1A">charger × target 20-100%</text>
<text x="455.0" y="148.9" font-size="13" text-anchor="middle" fill="#1A1A1A">(steps of 5%)</text>
<rect x="630" y="70" width="250" height="100" rx="7" fill="#DFF0D8" stroke="#3C7A3C" stroke-width="1.5"/>
<text x="755.0" y="108.3" font-size="13" text-anchor="middle" fill="#1A1A1A" font-weight="bold">2. Drive each leg in SUMO</text>
<text x="755.0" y="124.5" font-size="13" text-anchor="middle" fill="#1A1A1A">start → charger → destination</text>
<text x="755.0" y="140.8" font-size="13" text-anchor="middle" fill="#1A1A1A">Leaf e+ physics, real roads</text>
<rect x="930" y="70" width="230" height="100" rx="7" fill="#DFF0D8" stroke="#3C7A3C" stroke-width="1.5"/>
<text x="1045.0" y="108.3" font-size="13" text-anchor="middle" fill="#1A1A1A" font-weight="bold">3. Add heating/cooling</text>
<text x="1045.0" y="124.5" font-size="13" text-anchor="middle" fill="#1A1A1A">226 W per °C below 12 °C</text>
<text x="1045.0" y="140.8" font-size="13" text-anchor="middle" fill="#1A1A1A">303 W per °C above 30 °C</text>
<rect x="930" y="210" width="230" height="120" rx="7" fill="#DFF0D8" stroke="#3C7A3C" stroke-width="1.5"/>
<text x="1045.0" y="242.1" font-size="13" text-anchor="middle" fill="#1A1A1A" font-weight="bold">4. Charging time and cost</text>
<text x="1045.0" y="258.3" font-size="13" text-anchor="middle" fill="#1A1A1A">Level 2: 6.6 kW</text>
<text x="1045.0" y="274.6" font-size="13" text-anchor="middle" fill="#1A1A1A">DC: 50 kW, slower in the cold</text>
<text x="1045.0" y="290.8" font-size="13" text-anchor="middle" fill="#1A1A1A">and above 80%</text>
<text x="1045.0" y="307.1" font-size="13" text-anchor="middle" fill="#1A1A1A">listed or assumed price</text>
<rect x="630" y="210" width="250" height="120" rx="7" fill="#DFF0D8" stroke="#3C7A3C" stroke-width="1.5"/>
<text x="755.0" y="242.1" font-size="13" text-anchor="middle" fill="#1A1A1A" font-weight="bold">5. Check every rule</text>
<text x="755.0" y="258.3" font-size="13" text-anchor="middle" fill="#1A1A1A">plug fits, working, public</text>
<text x="755.0" y="274.6" font-size="13" text-anchor="middle" fill="#1A1A1A">battery never below 10%</text>
<text x="755.0" y="290.8" font-size="13" text-anchor="middle" fill="#1A1A1A">arrive by the deadline</text>
<text x="755.0" y="307.1" font-size="13" text-anchor="middle" fill="#1A1A1A">stay within the budget</text>
<rect x="330" y="210" width="250" height="120" rx="7" fill="#DFF0D8" stroke="#3C7A3C" stroke-width="1.5"/>
<text x="455.0" y="250.2" font-size="13" text-anchor="middle" fill="#1A1A1A" font-weight="bold">6. Rank the valid options</text>
<text x="455.0" y="266.4" font-size="13" text-anchor="middle" fill="#1A1A1A">fastest: earliest arrival</text>
<text x="455.0" y="282.7" font-size="13" text-anchor="middle" fill="#1A1A1A">cheapest: lowest cost</text>
<text x="455.0" y="298.9" font-size="13" text-anchor="middle" fill="#1A1A1A">→ best answer (and runner-up)</text>
<rect x="330" y="380" width="250" height="120" rx="7" fill="#DFF0D8" stroke="#3C7A3C" stroke-width="1.5"/>
<text x="455.0" y="412.1" font-size="13" text-anchor="middle" fill="#1A1A1A" font-weight="bold">7. Robustness check</text>
<text x="455.0" y="428.3" font-size="13" text-anchor="middle" fill="#1A1A1A">repeat with energy ±10%</text>
<text x="455.0" y="444.6" font-size="13" text-anchor="middle" fill="#1A1A1A">and half the heating;</text>
<text x="455.0" y="460.8" font-size="13" text-anchor="middle" fill="#1A1A1A">keep only if the best</text>
<text x="455.0" y="477.1" font-size="13" text-anchor="middle" fill="#1A1A1A">answer stays the same</text>
<rect x="20" y="380" width="200" height="120" rx="7" fill="#FCEFD4" stroke="#A8741A" stroke-width="1.5"/>
<text x="120.0" y="395.8" font-size="13" text-anchor="middle" fill="#1A1A1A" font-weight="bold">Graded situation</text>
<text x="120.0" y="412.1" font-size="13" text-anchor="middle" fill="#1A1A1A">answer stored with the</text>
<text x="120.0" y="428.3" font-size="13" text-anchor="middle" fill="#1A1A1A">full</text>
<text x="120.0" y="444.6" font-size="13" text-anchor="middle" fill="#1A1A1A">table of options, so any</text>
<text x="120.0" y="460.8" font-size="13" text-anchor="middle" fill="#1A1A1A">decision can be judged</text>
<text x="120.0" y="477.1" font-size="13" text-anchor="middle" fill="#1A1A1A">(arrival, cost, rules</text>
<text x="120.0" y="493.3" font-size="13" text-anchor="middle" fill="#1A1A1A">broken)</text>
<rect x="700" y="400" width="250" height="80" rx="7" fill="#EEEEEE" stroke="#666666" stroke-width="1.5"/>
<text x="825.0" y="428.3" font-size="13" text-anchor="middle" fill="#1A1A1A" font-weight="bold">Set aside as uncertain</text>
<text x="825.0" y="444.6" font-size="13" text-anchor="middle" fill="#1A1A1A">the referee itself cannot be</text>
<text x="825.0" y="460.8" font-size="13" text-anchor="middle" fill="#1A1A1A">sure (about 1 in 3)</text>
<path d="M280.0,145.0 L305.0,145.0 L305.0,120.0 L330.0,120.0" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M580.0,120.0 L630.0,120.0" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M880.0,120.0 L930.0,120.0" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M1045.0,170.0 L1045.0,210.0" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M930.0,270.0 L880.0,270.0" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M630.0,270.0 L580.0,270.0" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M455.0,330.0 L455.0,380.0" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M330.0,440.0 L220.0,440.0" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="253.3" y="431.0" width="43.4" height="17" fill="#FFFFFF"/>
<text x="275.0" y="444.0" font-size="11" text-anchor="middle" fill="#333">stable</text>
<path d="M580.0,440.0 L700.0,440.0" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="600.6" y="431.0" width="78.8" height="17" fill="#FFFFFF"/>
<text x="640.0" y="444.0" font-size="11" text-anchor="middle" fill="#333">answer flips</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>