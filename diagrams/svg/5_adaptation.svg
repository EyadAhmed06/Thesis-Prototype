<text x="1060.0" y="277.7" font-size="13" text-anchor="middle" fill="#1A1A1A">same situations</text>
<text x="1060.0" y="293.9" font-size="13" text-anchor="middle" fill="#1A1A1A">McNemar + Holm</text>
<text x="1060.0" y="310.2" font-size="13" text-anchor="middle" fill="#1A1A1A">(36 tests)</text>
