<text x="480.0" y="301.4" font-size="13" text-anchor="middle" fill="#1A1A1A">the 2 training requests most like</text>
<text x="480.0" y="317.7" font-size="13" text-anchor="middle" fill="#1A1A1A">the driver&#x27;s words (TF-IDF),</text>
<text x="480.0" y="333.9" font-size="13" text-anchor="middle" fill="#1A1A1A">with their correct answers</text>
<rect x="330" y="370" width="300" height="90" rx="7" fill="#EADCF5" stroke="#6E4A9E" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="480.0" y="395.2" font-size="13" text-anchor="middle" fill="#1A1A1A" font-weight="bold">lora</text>
<text x="480.0" y="411.4" font-size="13" text-anchor="middle" fill="#1A1A1A">fine-tuned once (QLoRA, r = 16,</text>
<text x="480.0" y="427.7" font-size="13" text-anchor="middle" fill="#1A1A1A">2 epochs, 396 / 44 situations),</text>
<text x="480.0" y="443.9" font-size="13" text-anchor="middle" fill="#1A1A1A">same 4-bit base model</text>
<rect x="700" y="200" width="220" height="130" rx="7" fill="#FCEFD4" stroke="#A8741A" stroke-width="1.5"/>
<text x="810.0" y="237.1" font-size="13" text-anchor="middle" fill="#1A1A1A" font-weight="bold">Ann Arbor test</text>
<text x="810.0" y="253.3" font-size="13" text-anchor="middle" fill="#1A1A1A">300 situations</text>
<text x="810.0" y="269.6" font-size="13" text-anchor="middle" fill="#1A1A1A">new roads, and 4 wish</text>
<text x="810.0" y="285.8" font-size="13" text-anchor="middle" fill="#1A1A1A">kinds never seen</text>
<text x="810.0" y="302.1" font-size="13" text-anchor="middle" fill="#1A1A1A">in training</text>
