<text x="135.0" y="237.1" font-size="13" text-anchor="middle" fill="#1A1A1A" font-weight="bold">Detroit training set</text>
<text x="135.0" y="253.3" font-size="13" text-anchor="middle" fill="#1A1A1A">440 situations</text>
<text x="135.0" y="269.6" font-size="13" text-anchor="middle" fill="#1A1A1A">only the 3 training wish kinds</text>
<text x="135.0" y="285.8" font-size="13" text-anchor="middle" fill="#1A1A1A">every answer re-graded</text>
<text x="135.0" y="302.1" font-size="13" text-anchor="middle" fill="#1A1A1A">by the referee: all correct</text>
<rect x="330" y="60" width="300" height="80" rx="7" fill="#EADCF5" stroke="#6E4A9E" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="480.0" y="96.4" font-size="13" text-anchor="middle" fill="#1A1A1A" font-weight="bold">none</text>
<text x="480.0" y="112.7" font-size="13" text-anchor="middle" fill="#1A1A1A">the plain instruction</text>
<rect x="330" y="160" width="300" height="80" rx="7" fill="#EADCF5" stroke="#6E4A9E" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="480.0" y="188.3" font-size="13" text-anchor="middle" fill="#1A1A1A" font-weight="bold">rules</text>
<text x="480.0" y="204.6" font-size="13" text-anchor="middle" fill="#1A1A1A">plain instruction + a step-by-step</text>
<text x="480.0" y="220.8" font-size="13" text-anchor="middle" fill="#1A1A1A">way to check a decision</text>
