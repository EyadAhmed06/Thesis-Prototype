<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="410" viewBox="0 0 1180 410" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#444"/></marker></defs>
<rect width="1180" height="410" fill="#FFFFFF"/>
<text x="20" y="34" font-size="18" font-weight="bold" fill="#222">The whole study with one command: python evbench.py run</text>
<rect x="20" y="80" width="145" height="110" rx="7" fill="#DCEAF7" stroke="#3B6E9E" stroke-width="1.5"/>
<text x="92.5" y="124.2" font-size="12" text-anchor="middle" fill="#1A1A1A" font-weight="bold">1. Check inputs</text>
<text x="92.5" y="139.2" font-size="12" text-anchor="middle" fill="#1A1A1A">maps, chargers,</text>
<text x="92.5" y="154.2" font-size="12" text-anchor="middle" fill="#1A1A1A">trip data present</text>
<rect x="185" y="80" width="145" height="110" rx="7" fill="#DFF0D8" stroke="#3C7A3C" stroke-width="1.5"/>
<text x="257.5" y="124.2" font-size="12" text-anchor="middle" fill="#1A1A1A" font-weight="bold">2. Validate referee</text>
<text x="257.5" y="139.2" font-size="12" text-anchor="middle" fill="#1A1A1A">DEVRT and VED</text>
<text x="257.5" y="154.2" font-size="12" text-anchor="middle" fill="#1A1A1A">real trips</text>
<rect x="350" y="80" width="145" height="110" rx="7" fill="#FCEFD4" stroke="#A8741A" stroke-width="1.5"/>
<text x="422.5" y="124.2" font-size="12" text-anchor="middle" fill="#1A1A1A" font-weight="bold">3. Build situations</text>
<text x="422.5" y="139.2" font-size="12" text-anchor="middle" fill="#1A1A1A">check the frozen</text>
<text x="422.5" y="154.2" font-size="12" text-anchor="middle" fill="#1A1A1A">fingerprint</text>
<rect x="515" y="80" width="145" height="110" rx="7" fill="#EEEEEE" stroke="#666666" stroke-width="1.5"/>
<text x="587.5" y="124.2" font-size="12" text-anchor="middle" fill="#1A1A1A" font-weight="bold">4. Baselines</text>
<text x="587.5" y="139.2" font-size="12" text-anchor="middle" fill="#1A1A1A">5 fixed methods +</text>
<text x="587.5" y="154.2" font-size="12" text-anchor="middle" fill="#1A1A1A">sensitivity check</text>
<rect x="680" y="80" width="145" height="110" rx="7" fill="#EADCF5" stroke="#6E4A9E" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="752.5" y="124.2" font-size="12" text-anchor="middle" fill="#1A1A1A" font-weight="bold">5. Run models</text>
<text x="752.5" y="139.2" font-size="12" text-anchor="middle" fill="#1A1A1A">roles, wordings,</text>
<text x="752.5" y="154.2" font-size="12" text-anchor="middle" fill="#1A1A1A">adaptations, threads</text>
<rect x="845" y="80" width="145" height="110" rx="7" fill="#FBE0DC" stroke="#A8483A" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="917.5" y="124.2" font-size="12" text-anchor="middle" fill="#1A1A1A" font-weight="bold">6. Score</text>
<text x="917.5" y="139.2" font-size="12" text-anchor="middle" fill="#1A1A1A">referee grading +</text>
<text x="917.5" y="154.2" font-size="12" text-anchor="middle" fill="#1A1A1A">paired statistics</text>
<rect x="1010" y="80" width="145" height="110" rx="7" fill="#FFFFFF" stroke="#999999" stroke-width="1.5"/>
<text x="1082.5" y="124.2" font-size="12" text-anchor="middle" fill="#1A1A1A" font-weight="bold">7. Report</text>
<text x="1082.5" y="139.2" font-size="12" text-anchor="middle" fill="#1A1A1A">one HTML page</text>
<text x="1082.5" y="154.2" font-size="12" text-anchor="middle" fill="#1A1A1A">with every table</text>
<rect x="20" y="250" width="540" height="80" rx="7" fill="#FFFFFF" stroke="#999999" stroke-width="1.5"/>
<text x="290.0" y="279.2" font-size="12" text-anchor="middle" fill="#1A1A1A">Each stage stores SHA-256 fingerprints of what it read and wrote:</text>
<text x="290.0" y="294.2" font-size="12" text-anchor="middle" fill="#1A1A1A">a stage whose inputs did not change is skipped; an interrupted</text>
<text x="290.0" y="309.2" font-size="12" text-anchor="middle" fill="#1A1A1A">model run resumes where it stopped</text>
<rect x="640" y="250" width="520" height="80" rx="7" fill="#FBE0DC" stroke="#A8483A" stroke-width="1.5"/>
<text x="900.0" y="278.3" font-size="13" text-anchor="middle" fill="#1A1A1A" font-weight="bold">Live dashboard in the browser</text>
<text x="900.0" y="294.6" font-size="13" text-anchor="middle" fill="#1A1A1A">each answer is graded the moment it arrives,</text>
<text x="900.0" y="310.8" font-size="13" text-anchor="middle" fill="#1A1A1A">with the same referee code</text>
<rect x="20" y="360" width="150" height="30" rx="7" fill="#FFFFFF" stroke="#999999" stroke-width="1.5"/>
<text x="95.0" y="378.9" font-size="11" text-anchor="middle" fill="#1A1A1A">Done and tested</text>
<rect x="180" y="360" width="190" height="30" rx="7" fill="#FFFFFF" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="275.0" y="378.9" font-size="11" text-anchor="middle" fill="#1A1A1A">Ready, not yet run / planned</text>
<path d="M165.0,135.0 L185.0,135.0" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M330.0,135.0 L350.0,135.0" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M495.0,135.0 L515.0,135.0" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M660.0,135.0 L680.0,135.0" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M825.0,135.0 L845.0,135.0" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M990.0,135.0 L1010.0,135.0" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M752.5,190.0 L752.5,220.0 L900.0,220.0 L900.0,250.0" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#ah)" stroke-dasharray="5 4"/>
